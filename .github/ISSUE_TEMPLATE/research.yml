name: Research / Architecture Synthesis
description: Research task, synthesis, or architecture decision update
labels:
  - research
title: "[Research]: "
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should this issue deliver?
      placeholder: "Synthesize findings from ... into a single recommendation"
    validations:
      required: true

  - type: textarea
    id: questions
    attributes:
      label: Research Questions
      description: What questions need answering?
      placeholder: |
        - What is the recommended approach for ...?
        - How do agents X and Y diverge on ...?
    validations:
      required: true

  - type: textarea
    id: requirements
    attributes:
      label: Requirement References
      description: Link or cite relevant requirements sections.
      placeholder: |
        - docs/requirements/poc-requirements.md §...
    validations:
      required: false

  - type: textarea
    id: architecture
    attributes:
      label: Architecture References
      description: Link or cite relevant architecture sections.
      placeholder: |
        - docs/architecture/architecture-overview.md §...
        - docs/architecture/implementation-guardrails.md §...
    validations:
      required: true

  - type: textarea
    id: inputs
    attributes:
      label: Inputs / Evidence
      description: Research notes, data, or evidence to synthesize.
      placeholder: |
        - docs/research/notes/...
        - docs/research/backlog/...
    validations:
      required: true

  - type: textarea
    id: deliverables
    attributes:
      label: Expected Deliverables
      description: Concrete outputs this issue should produce.
      placeholder: |
        - Synthesis document at docs/research/...
        - Updated architecture section ...
        - Updated decision log entry
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of Scope
      description: Explicitly exclude adjacent work.
      placeholder: |
        - Do not implement code
        - Do not expand to ideas in docs/ideas/
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: How will we know this is done correctly?
      placeholder: |
        - Synthesis document reviewed by OG
        - Architecture updates preserve decision status convention
        - Research backlog statuses are correct
    validations:
      required: true
