[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mena"
version = "0.1.0"
description = "Privacy-first local meeting notes PoC."
readme = "../README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mena = "mena.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mena"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.pytest.ini_options]
addopts = "-q --strict-config --strict-markers"
testpaths = ["tests"]

[tool.mypy]
files = ["src", "tests"]
mypy_path = "src"
python_version = "3.11"
strict = true

