[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mena"
version = "0.1.0rc2"
description = "Privacy-first local meeting notes PoC."
readme = "../README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
asr = [
    "faster-whisper>=1.0",
]
diarization = [
    "pyannote.audio>=3.3",
]
local-providers = [
    "faster-whisper>=1.0",
    "pyannote.audio>=3.3",
]

[project.scripts]
mena = "mena.cli:main"

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "mypy>=1.14",
    "pre-commit>=4.6.0",
    "pytest>=8.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.8",
    "types-jsonschema>=4.26.0.20260508",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mena"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.pytest.ini_options]
addopts = "-q --strict-config --strict-markers --cov=mena --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["mena"]
omit = ["src/mena/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
files = ["src", "tests"]
mypy_path = "src"
python_version = "3.11"
strict = true
