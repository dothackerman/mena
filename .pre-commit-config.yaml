default_install_hook_types:
  - pre-commit
  - pre-push

repos:
  - repo: local
    hooks:
      - id: mena-format-check
        name: mena format check
        entry: make -C app format-check
        language: system
        pass_filenames: false
        stages:
          - pre-commit

      - id: mena-lint
        name: mena lint
        entry: make -C app lint
        language: system
        pass_filenames: false
        stages:
          - pre-commit

      - id: mena-pre-push-check
        name: mena full check
        entry: make -C app check
        language: system
        pass_filenames: false
        stages:
          - pre-push
